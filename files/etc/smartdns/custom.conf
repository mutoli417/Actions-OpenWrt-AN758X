# SmartDNS 本地补充规则（上游 init 末尾以 conf-file 引入）
# 匹配为后缀匹配（非正则），不要写 \. 转义。

# 引导死锁护栏：代理自身节点域名必须走 cn 直连组，绝不走经代理的上游。
# 实测三台国内公共 DNS 均返回 155.254.101.x 健康中继池；留给 dnsmasq 默认
# 上游可能落到 82.47.47.19（池健康度未验证），故此规则必须显式覆盖。
nameserver /infralinkplus.com/ cn

# 双栈对齐：与 sing-box 全局 ipv4_only 一致，不向外返回 AAAA；
# 漏网的非 CN IPv6 由 v6hybrid logical-and 兜底规则阻断。
dualstack-ip-selection no

# 陈旧缓存关闭：避免上游曾返回的污染 IP 被过期记录延续（陈旧缓存投毒护栏）。
serve-expired no
